name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --offline --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --offline --target ${{ matrix.target }}
      - run: cargo build --locked --offline --target ${{ matrix.target }}
      - name: Native Bash and Zsh completion
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v zsh >/dev/null; then sudo apt-get update && sudo apt-get install -y zsh; fi
          python3 scripts/test-shells.py --binary "target/$BUILD_TARGET/debug/git-autocomplete"
      - name: Native PowerShell completion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd/target/$env:BUILD_TARGET/debug;" + $env:PATH
          ./scripts/test-powershell.ps1
      - name: Package and isolated installation checks
        shell: bash
        run: |
          python3 scripts/test-package.py
          package_executable="target/$BUILD_TARGET/debug/git-autocomplete"
          archive_suffix=.tar.gz
          if [[ "$RUNNER_OS" == Windows ]]; then package_executable+=.exe; archive_suffix=.zip; fi
          python3 scripts/package.py --binary "$package_executable" --target "$BUILD_TARGET"
          python3 scripts/test-install.py "dist/git-autocomplete-$BUILD_TARGET$archive_suffix"
  fish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: cargo build --locked --offline
      - name: Add development binary to PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - run: fish --no-config scripts/test-fish.fish
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo test --locked --offline
  benchmark:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --offline
      - run: python3 scripts/benchmark.py --runs 20
